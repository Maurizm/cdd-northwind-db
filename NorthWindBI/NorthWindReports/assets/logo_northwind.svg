<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="500" height="130">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001845" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Yellow pill badge -->
  <rect x="25" y="15" width="450" height="100" rx="50" fill="#FFD100" filter="url(#shadow)"/>
