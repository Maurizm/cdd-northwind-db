<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="650" height="140">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Crest & Compass Container -->
  <g transform="translate(75, 70)" filter="url(#subtleGlow)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="54" fill="#0B1A2C" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.75"/>
    <circle cx="0" cy="0" r="42" fill="#0F243A" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Compass Rose / Wind Star (8 Points) -->
    <!-- Secondary Points (Diagonal) -->
    <polygon points="0,0 -8,-8 0,-36 8,-8" fill="url(#goldGrad2)" opacity="0.7" transform="rotate(45)"/>
    <polygon points="0,0 -8,-8 0,-36 8,-8" fill="url(#goldGrad2)" opacity="0.7" transform="rotate(135)"/>
    <polygon points="0,0 -8,-8 0,-36 8,-8" fill="url(#goldGrad2)" opacity="0.7" transform="rotate(225)"/>
    <polygon points="0,0 -8,-8 0,-36 8,-8" fill="url(#goldGrad2)" opacity="0.7" transform="rotate(315)"/>

    <!-- Cardinal Points (N, S, E, W) -->
    <!-- North -->
    <polygon points="0,0 -10,-8 0,-44" fill="url(#goldGrad)"/>
    <polygon points="0,0 10,-8 0,-44" fill="#885E14"/>
    <!-- South -->
    <polygon points="0,0 -10,8 0,44" fill="#885E14"/>
    <polygon points="0,0 10,8 0,44" fill="url(#goldGrad)"/>
    <!-- East -->
    <polygon points="0,0 8,-10 44,0" fill="url(#goldGrad)"/>
    <polygon points="0,0 8,10 44,0" fill="#885E14"/>
    <!-- West -->
    <polygon points="0,0 -8,-10 -44,0" fill="#885E14"/>
    <polygon points="0,0 -8,10 -44,0" fill="url(#goldGrad)"/>

    <!-- Central Galleon / Trading Ship Silhouette -->
    <circle cx="0" cy="0" r="14" fill="#0B1A2C" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M-7,2 C-5,6 5,6 7,2 L8,4 C5,8 -5,8 -8,4 Z" fill="url(#goldGrad)"/>
    <path d="M-1,1 L-1,-9 L5,-4 L-1,-1 Z" fill="url(#goldGrad)"/>
    <path d="M-3,-1 L-3,-7 L-6,-4 L-3,-1 Z" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(155, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="62" font-family="'Cinzel', 'Georgia', 'Segoe UI', serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="4">
      NORTHWIND
    </text>
    <text x="315" y="62" font-family="'Cinzel', 'Georgia', 'Segoe UI', serif" font-size="38" font-weight="700" fill="url(#goldText)" letter-spacing="4">
      TRADERS
    </text>

    <!-- Decorative Divider Line with Diamond Center -->
    <line x1="2" y1="78" x2="225" y2="78" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
    <polygon points="235,78 240,74 245,78 240,82" fill="url(#goldGrad)"/>
    <line x1="255" y1="78" x2="475" y2="78" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Subtitle / Tagline -->
    <text x="2" y="104" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="3.5">
      IMPORT &amp; EXPORT OF SPECIALTY FOODS
    </text>
    <text x="355" y="104" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="700" fill="url(#goldText)" letter-spacing="2">
      • EST. 1994
    </text>
  </g>
</svg>
