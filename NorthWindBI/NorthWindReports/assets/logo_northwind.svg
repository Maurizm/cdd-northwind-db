    <polygon points="25,5 31,19 45,25 31,31 25,45 19,31 5,25 19,19" fill="#0A3871"/>
    <circle cx="25" cy="25" r="4" fill="#FFD100"/>
  </g>
  <!-- Text -->
  <text x="260" y="74" font-family="'Segoe UI', 'Impact', sans-serif" font-size="34" font-weight="900" fill="#0A3871" text-anchor="middle" letter-spacing="2">NORTHWIND TRADERS</text>
