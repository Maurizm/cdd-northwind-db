<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="goldStrokeRev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
  </defs>
  <!-- Chart Baseline -->
  <line x1="14" y1="84" x2="86" y2="84" stroke="url(#goldStrokeRev)" stroke-width="2" />
  
  <!-- Ascending Revenue Bars -->
  <rect x="20" y="58" width="10" height="26" rx="2" stroke="url(#goldStrokeRev)" stroke-width="2" />
  <rect x="36" y="44" width="10" height="40" rx="2" stroke="url(#goldStrokeRev)" stroke-width="2" />
  <rect x="52" y="32" width="10" height="52" rx="2" stroke="url(#goldStrokeRev)" stroke-width="2" />
  <rect x="68" y="18" width="10" height="66" rx="2" fill="rgba(212,175,55,0.15)" stroke="url(#goldStrokeRev)" stroke-width="2" />

  <!-- Upward Trendline -->
  <polyline points="16,62 34,48 50,38 72,16 84,16" stroke="#FFFFFF" stroke-width="2.5" />
  <polyline points="74,16 84,16 84,26" stroke="#FFFFFF" stroke-width="2.5" />
