<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="360" viewBox="0 0 676 180">
  <!-- 03 Clientes: three avatars linked by a dotted conversation arc on mint. -->
  <defs>
    <style>
      .ord  { font: 800 64px 'Segoe UI', Arial, sans-serif; fill: #087F75; }
      .q    { font: 700 27px 'Segoe UI', Arial, sans-serif; fill: #1F3864; }
      .st   { stroke: #1F3864; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="676" height="180" rx="18" fill="#E4F6F0"/>

  <text class="ord" x="44" y="86">03</text>
  <text class="q" x="44" y="132">¿Quién compra?</text>

  <!-- dotted link arc between avatars -->
  <path d="M414 84 C 460 42, 520 42, 566 84"
        fill="none" stroke="#087F75" stroke-width="4"
        stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- speech bubble above the arc -->
  <rect x="456" y="18" width="68" height="34" rx="12" fill="#FFFFFF" class="st"/>
  <path class="st" fill="#FFFFFF" d="M480 52 l-6 14 l20 -12 z"/>
  <circle cx="476" cy="35" r="3.2" fill="#087F75"/>
  <circle cx="490" cy="35" r="3.2" fill="#087F75"/>
  <circle cx="504" cy="35" r="3.2" fill="#087F75"/>

  <!-- avatar 1 -->
  <circle class="st" cx="414" cy="102" r="18" fill="#8FD8C9"/>
  <path class="st" fill="#8FD8C9"
        d="M386 152 C 388 128, 440 128, 442 152 z"/>
  <!-- avatar 2 (centre, slightly larger) -->
  <circle class="st" cx="490" cy="96" r="21" fill="#4FBFA9"/>
  <path class="st" fill="#4FBFA9"
        d="M458 152 C 460 124, 520 124, 522 152 z"/>
  <!-- avatar 3 -->
  <circle class="st" cx="566" cy="102" r="18" fill="#8FD8C9"/>
  <path class="st" fill="#8FD8C9"
        d="M538 152 C 540 128, 592 128, 594 152 z"/>
</svg>
