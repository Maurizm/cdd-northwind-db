<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NorthWind - Vista previa de diseño (sin datos)</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --page-bg: #F5F3EE; --panel-bg: #FFFFFF; --text: #253331;
    --teal: #155E63; --orange: #D88935; --border: #E3DED4;
    --muted: #8FA396;
    --label-font: "DIN", "Segoe UI", Arial, sans-serif;
    --heading-font: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--text);
         font-family: var(--label-font); }
  .banner { background: var(--teal); color: #fff; padding: 10px 24px;
            font-size: 14px; }
  .banner strong { font-family: var(--heading-font); }
  .banner .warn { opacity: .9; }
  .tabs { display: flex; gap: 4px; padding: 8px 24px 0; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: var(--panel-bg);
                 color: var(--text); padding: 8px 16px; border-radius: 6px 6px 0 0;
                 border-bottom: none; font-family: var(--label-font);
                 font-size: 13px; cursor: pointer; }
  .tabs button.active { background: var(--panel-bg); color: var(--teal);
                        font-weight: 700; }
  .wrap { padding: 0 24px 32px; }
  .page { display: none; position: relative; aspect-ratio: 16 / 9;
          width: 100%; max-width: 1440px; margin: 0 auto;
          background:
            radial-gradient(rgba(37, 51, 49, .05) 1px, transparent 1.6px),
            linear-gradient(150deg, #F7F4EC 0%, #EFE8DB 60%, var(--page-bg) 100%);
          background-size: 20px 20px, 100% 100%;
          border: 1px dashed var(--border); border-radius: 8px; }
  .page.active { display: block; }
  /* Geometry comes from CSS custom properties set inline, so the mobile
     media query can override it freely (no inline width/height to beat). */
  .panel { position: absolute; left: var(--x); top: var(--y);
           width: var(--w); height: var(--h);
           background: var(--panel-bg); border: 1px solid var(--border);
           border-radius: 6px; overflow: hidden; display: flex;
           flex-direction: column; }
  .panel .vtitle { font-size: max(12px, .8vw); font-weight: 700;
                   padding: 6px 8px; color: var(--text);
                   letter-spacing: .02em; }
  .panel .vbody { flex: 1; display: flex; align-items: center;
                  justify-content: center; flex-direction: column; gap: 4px;
                  border-top: 1px solid var(--border); color: var(--teal);
                  font-size: max(12px, .9vw); }
  .panel .kind { font-size: 9px; color: var(--muted); text-transform: uppercase;
                 letter-spacing: .08em; }
  .panel.card .vbody { font-size: max(20px, 1.8vw); font-weight: 700; }
  .panel.card.discount .vbody { color: var(--orange); }
  .panel.slicer .vbody { flex-direction: row; justify-content: space-between;
                         padding: 0 10px; font-size: 11px; color: var(--text); }
  .panel.slicer .vbody::after { content: "\25BE"; color: var(--teal); }
  .panel.tableEx .vbody { padding: 6px 8px; align-items: stretch;
                          justify-content: flex-start; }
  .panel.tableEx .trow { display: flex; gap: 8px; font-size: 10px;
                         border-bottom: 1px solid var(--border);
                         padding: 3px 0; color: var(--text); }
  .panel.tableEx .trow.head { font-weight: 700; color: var(--teal); }
  .axis { width: 70%; height: 55%; border-left: 1px solid var(--border);
          border-bottom: 1px solid var(--border); }
  .heading { position: absolute; left: var(--x); top: var(--y);
             width: var(--w); height: var(--h); margin: 0;
             font-family: var(--heading-font); font-weight: 700;
             font-size: clamp(16px, 1.6vw, 26px); color: var(--text);
             display: flex; align-items: center; }
  .footnote { position: absolute; left: var(--x); top: var(--y);
              width: var(--w); height: var(--h); font-size: 9px;
              color: var(--muted); display: flex; align-items: center; }
  .hint { padding: 8px 24px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    .page { position: static; aspect-ratio: auto; }
    .panel, .heading, .footnote { position: static; width: 100%;
                                  height: auto; margin: 8px 0; }
    .heading { font-size: 20px; }
    .panel .vbody { min-height: 80px; }
    .panel.card .vbody { min-height: 60px; }
  }
</style>
</head>
<body>
<header class="banner">
  <strong>Vista previa de diseño - sin datos conectados</strong>
  <span class="warn">| Solo distribución y diseño; no es una renderización
  real de Power BI ni contiene métricas.</span>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="pages"></div>
<p class="hint">El layout proviene de <code>preview-layout.js</code>, archivo
generado por <code>build_report.py</code> desde el contrato vigente.</p>
<script src="preview-layout.js"></script>
<script>
// PAGES comes from generated preview-layout.js (name/title/type/rect only).
const PW = 1440, PH = 810;
const HEADING = [32,16,1120,48], FOOTER = [32,784,760,18];
const FOOTER_TEXT = "Importes sin moneda definida | Fechas historicas del origen";

function pos(r){
  return `--x:${r[0]/PW*100}%;--y:${r[1]/PH*100}%;`
       + `--w:${r[2]/PW*100}%;--h:${r[3]/PH*100}%;`;
}
function body(v){
  if(v.t==="slicer") return `<div class="vbody"><span>${v.title} --</span></div>`;
  if(v.t==="card") return `<div class="vbody">--<span class="kind">sin datos</span></div>`;
  if(v.t==="tableEx") return `<div class="vbody">
      <div class="trow head"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div></div>`;
  return `<div class="vbody"><div class="axis"></div>
      <span>Sin datos conectados</span><span class="kind">${v.t}</span></div>`;
}
function panel(v){
  const cls = v.t==="barChart" ? "bar" : v.t;
  return `<div class="panel ${cls} ${v.cls||""}" style="${pos(v.r)}" title="${v.name}">
    <div class="vtitle">${v.title}</div>${body(v)}</div>`;
}
PAGES.forEach((p,i)=>{
  const b=document.createElement("button");
  b.textContent=p.title; if(i===0)b.classList.add("active");
  b.onclick=()=>{document.querySelectorAll(".tabs button,.page")
    .forEach(e=>e.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("pg_"+p.name).classList.add("active");};
  document.getElementById("tabs").appendChild(b);
  const d=document.createElement("section");
  d.className="page"+(i===0?" active":""); d.id="pg_"+p.name;
  d.innerHTML=`<h2 class="heading" style="${pos(HEADING)}">NORTHWIND / ${p.title}</h2>`
    +p.visuals.map(panel).join("")
    +`<span class="footnote" style="${pos(FOOTER)}">${FOOTER_TEXT}</span>`;
  document.getElementById("pages").appendChild(d);
});
</script>
</body>
</html>
