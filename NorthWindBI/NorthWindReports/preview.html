<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NorthWind BI - Vista previa de diseño</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --page-bg: #F0F2F5; --panel-bg: #FFFFFF; --text: #252423;
    --blue: #118DFF; --green: #01B8AA; --orange: #FD625E;
    --amber: #F2C80F; --purple: #744DA9; --border: #D2D0CE;
    --muted: #605E5C;
    --label-font: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    --heading-font: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--text);
         font-family: var(--label-font); }
  .banner { background: var(--blue); color: #fff; padding: 10px 24px;
            font-size: 14px; }
  .banner strong { font-family: var(--heading-font); }
  .banner .warn { opacity: .9; }
  .tabs { display: flex; gap: 4px; padding: 8px 24px 0; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: var(--panel-bg);
                 color: var(--text); padding: 8px 16px; border-radius: 4px 4px 0 0;
                 border-bottom: none; font-family: var(--label-font);
                 font-size: 13px; cursor: pointer; }
  .tabs button.active { background: var(--panel-bg); color: var(--blue);
                        font-weight: 700; border-top: 3px solid var(--blue); }
  .wrap { padding: 0 24px 32px; }
  .page { display: none; position: relative; aspect-ratio: 16 / 9;
          width: 100%; max-width: 1440px; margin: 0 auto;
          background: #FFFFFF;
          border: 1px solid var(--border); border-radius: 4px; }
  .page.active { display: block; }
  .panel { position: absolute; left: var(--x); top: var(--y);
           width: var(--w); height: var(--h);
           background: var(--panel-bg); border: 1px solid var(--border);
           border-radius: 4px; overflow: hidden; display: flex;
           flex-direction: column; }
  .panel .vtitle { font-size: max(12px, .8vw); font-weight: 600;
                   padding: 6px 8px; color: var(--text); }
  .panel .vbody { flex: 1; display: flex; align-items: center;
                  justify-content: center; flex-direction: column; gap: 4px;
                  border-top: 1px solid var(--border); color: var(--blue);
                  font-size: max(12px, .9vw); }
  .panel .kind { font-size: 9px; color: var(--muted); text-transform: uppercase;
                 letter-spacing: .08em; }
  .panel.card .vbody { font-size: max(20px, 1.8vw); font-weight: 700; }
  
  /* Clases semánticas de color */
  .panel.sales .vbody, .panel.card.sales .vbody { color: var(--blue); }
  .panel.sales .axis { border-left-color: var(--blue); border-bottom-color: var(--blue); }
  .panel.volume .vbody, .panel.card.volume .vbody { color: var(--green); }
  .panel.volume .axis { border-left-color: var(--green); border-bottom-color: var(--green); }
  .panel.discount .vbody, .panel.card.discount .vbody { color: var(--orange); }
  .panel.discount .axis { border-left-color: var(--orange); border-bottom-color: var(--orange); }
  .panel.freight .vbody, .panel.card.freight .vbody { color: var(--amber); }
  .panel.freight .axis { border-left-color: var(--amber); border-bottom-color: var(--amber); }
  .panel.logistics .vbody, .panel.card.logistics .vbody { color: var(--purple); }
  .panel.logistics .axis { border-left-color: var(--purple); border-bottom-color: var(--purple); }

  .panel.slicer .vbody { flex-direction: row; justify-content: space-between;
                         padding: 0 10px; font-size: 11px; color: var(--text); }
  .panel.slicer .vbody::after { content: "\25BE"; color: var(--blue); }
  .panel.tableEx .vbody { padding: 6px 8px; align-items: stretch;
                          justify-content: flex-start; }
  .panel.tableEx .trow { display: flex; gap: 8px; font-size: 10px;
                         border-bottom: 1px solid var(--border);
                         padding: 3px 0; color: var(--text); }
  .panel.tableEx .trow.head { font-weight: 700; color: var(--blue); }
  .axis { width: 70%; height: 55%; border-left: 2px solid var(--blue);
          border-bottom: 2px solid var(--blue); }
  .txt { position: absolute; left: var(--x); top: var(--y);
         width: var(--w); height: var(--h); overflow: hidden;
         padding: 8px 12px; }
  .txt.boxed { background: var(--panel-bg); border: 1px solid var(--border);
               border-radius: 4px; }
  .txt .ttitle { font-weight: 700; font-size: max(12px, .9vw);
                 color: var(--text); }
  .txt .ttitle.plain { font-weight: 400; font-size: max(11px, .75vw); }
  .txt .tbody { font-size: max(11px, .75vw); color: var(--text);
                margin-top: 4px; line-height: 1.35; }
  .navbtn { position: absolute; left: var(--x); top: var(--y);
            width: var(--w); height: var(--h); cursor: pointer;
            background: var(--panel-bg); color: var(--blue);
            border: 1px solid var(--blue); border-radius: 8px;
            font-family: var(--label-font); font-size: max(12px, .8vw);
            font-weight: 600; }
  .navbtn:hover, .navbtn:focus-visible { background: var(--blue);
            color: #fff; outline: 2px solid var(--blue); outline-offset: 1px; }
  .navbtn.accent { background: var(--accent); color: #fff;
                   border-color: var(--accent); font-size: max(14px, 1vw); }
  .navbtn.accent::after { content: " \2192"; }
  .navbtn.accent:hover, .navbtn.accent:focus-visible {
            background: var(--hover, var(--accent));
            border-color: var(--hover, var(--accent)); color: #fff;
            outline: 2px solid var(--accent); outline-offset: 1px; }
  .art, .imgbtn { position: absolute; left: var(--x); top: var(--y);
            width: var(--w); height: var(--h); }
  .art { display: block; }
  .imgbtn { padding: 0; border: none; background: none; cursor: pointer;
            border-radius: 4px; }
  .imgbtn img { width: 100%; height: 100%; display: block;
                border-radius: 4px; }
  .imgbtn:hover { filter: brightness(0.97); }
  .imgbtn:focus-visible { outline: 2px solid var(--blue);
            outline-offset: 2px; }
  .heading { position: absolute; left: var(--x); top: var(--y);
             width: var(--w); height: var(--h); margin: 0;
             padding: 0 16px;
             background: var(--blue); color: #FFFFFF; border-radius: 4px;
             font-family: var(--heading-font); font-weight: 600;
             font-size: clamp(14px, 1.4vw, 18px);
             display: flex; align-items: center; }
  .footnote { position: absolute; left: var(--x); top: var(--y);
              width: var(--w); height: var(--h); font-size: 10px;
              color: var(--muted); display: flex; align-items: center; }
  .hint { padding: 8px 24px; font-size: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    .page { position: static; aspect-ratio: auto; }
    .panel, .heading, .footnote, .txt, .navbtn, .art, .imgbtn {
                                  position: static;
                                  width: 100%; height: auto; margin: 8px 0; }
    .heading { font-size: 18px; }
    .navbtn { padding: 10px; }
    .imgbtn img, .art { height: auto; }
    .panel .vbody { min-height: 80px; }
    .panel.card .vbody { min-height: 60px; }
  }
</style>
</head>
<body>
<header class="banner">
  <strong>Vista previa de diseño - Proyecto NorthWind BI</strong>
  <span class="warn">| Maquetación del dashboard (Grupo 5)</span>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap" id="pages"></div>
<p class="hint">El layout proviene de <code>preview-layout.js</code>, generado por <code>build_report.py</code>.</p>
<script src="preview-layout.js"></script>
<script>
// PAGES comes from generated preview-layout.js (name/title/type/rect only).
const PW = 1440, PH = 810;
const HEADING = [32,16,1376,44], FOOTER = [32,784,1376,18];
const FOOTER_TEXT = "Proyecto NorthWind BI - Grupo 5 | Business Intelligence";

function pos(r){
  return `--x:${r[0]/PW*100}%;--y:${r[1]/PH*100}%;`
       + `--w:${r[2]/PW*100}%;--h:${r[3]/PH*100}%;`;
}
function selectPage(name){
  document.querySelectorAll(".tabs button,.page")
    .forEach(e=>e.classList.remove("active"));
  const tab=document.getElementById("tab_"+name);
  if(tab) tab.classList.add("active");
  const pg=document.getElementById("pg_"+name);
  if(pg) pg.classList.add("active");
}
function body(v){
  if(v.t==="slicer") return `<div class="vbody"><span>${v.title} --</span></div>`;
  if(v.t==="card") return `<div class="vbody">--<span class="kind">sin datos</span></div>`;
  if(v.t==="tableEx") return `<div class="vbody">
      <div class="trow head"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div>
      <div class="trow"><span>--</span><span>--</span><span>--</span></div></div>`;
  return `<div class="vbody"><div class="axis"></div>
      <span style="font-size:11px;font-weight:600;">[Etiquetas activas]</span><span class="kind">${v.t}</span></div>`;
}
function panel(v){
  if(v.t==="textbox"){
    const t=v.text||{};
    const body=t.body?`<div class="tbody">${t.body}</div>`:"";
    return `<div class="txt ${t.panel?"boxed":"plain"} ${v.cls||""}" style="${pos(v.r)}" title="${v.name}">
      <div class="ttitle ${t.strong===false?"plain":""}">${t.title||v.title}</div>${body}</div>`;
  }
  if(v.t==="image"){
    const img=v.image||{};
    const src=`NorthWind.Report/StaticResources/RegisteredResources/${img.resource||""}`;
    const a=v.action||{};
    if(a.type==="PageNavigation"){
      return `<button class="imgbtn" style="${pos(v.r)}" title="${v.name}"
        aria-label="${img.alt||v.title}" onclick="selectPage('${a.target}')">
        <img src="${src}" alt="${img.alt||""}"></button>`;
    }
    return `<img class="art" style="${pos(v.r)}" title="${v.name}"
      src="${src}" alt="${img.alt||""}">`;
  }
  if(v.t==="actionButton"){
    const a=v.action||{};
    const ap=v.appearance||{};
    const click=a.type==="PageNavigation"?` onclick="selectPage('${a.target}')"`:"";
    const style=ap.accent?`--accent:${ap.accent};--hover:${ap.hover||ap.accent};`:"";
    return `<button class="navbtn ${ap.accent?"accent":""}" style="${style}${pos(v.r)}" title="${v.name}"
      aria-label="${v.title}"${click}>${v.title}</button>`;
  }
  const cls = v.t==="barChart" ? "bar" : v.t;
  return `<div class="panel ${cls} ${v.cls||""}" style="${pos(v.r)}" title="${v.name}">
    <div class="vtitle">${v.title}</div>${body(v)}</div>`;
}
PAGES.forEach((p,i)=>{
  const b=document.createElement("button");
  b.textContent=p.title; b.id="tab_"+p.name;
  if(i===0)b.classList.add("active");
  b.onclick=()=>selectPage(p.name);
  document.getElementById("tabs").appendChild(b);
  const d=document.createElement("section");
  d.className="page"+(i===0?" active":""); d.id="pg_"+p.name;
  d.innerHTML=`<h2 class="heading" style="${pos(p.hr||HEADING)}">NORTHWIND / ${p.title}</h2>`
    +p.visuals.map(panel).join("")
    +`<span class="footnote" style="${pos(FOOTER)}">${FOOTER_TEXT}</span>`;
  document.getElementById("pages").appendChild(d);
});
</script>
</body>
</html>
